<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f2a43"/>
      <stop offset="100%" stop-color="#173f5f"/>
    </linearGradient>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #ffffff; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #ffffff; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #d7e7f5; }
      .box { fill: #20639b; stroke: #ffffff; stroke-width: 2; rx: 12; }
      .accent { fill: #3caea3; stroke: #ffffff; stroke-width: 2; rx: 12; }
      .warn { fill: #ed553b; stroke: #ffffff; stroke-width: 2; rx: 12; }
      .arrow { stroke: #ffffff; stroke-width: 3; marker-end: url(#m); fill: none; }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>
  <text x="40" y="55" class="title">NTP Timing Lifecycle for Occultation Reporting</text>

  <rect x="50" y="110" width="190" height="80" class="box"/>
  <text x="70" y="145" class="label">NTP Sources</text>
  <text x="70" y="168" class="small">peerstats / loopstats</text>

  <rect x="290" y="110" width="190" height="80" class="accent"/>
  <text x="315" y="145" class="label">Quality Filter</text>
  <text x="315" y="168" class="small">dispersion + jitter gates</text>

  <rect x="530" y="110" width="190" height="80" class="box"/>
  <text x="555" y="145" class="label">Offset Model</text>
  <text x="555" y="168" class="small">A / B / C / D bounds</text>

  <rect x="290" y="260" width="190" height="80" class="warn"/>
  <text x="318" y="295" class="label">Risk Bands</text>
  <text x="318" y="318" class="small">good / caution / reject</text>

  <rect x="530" y="260" width="280" height="120" class="accent"/>
  <text x="555" y="295" class="label">Report Decision</text>
  <text x="555" y="322" class="small">D/R timestamp confidence</text>
  <text x="555" y="346" class="small">export as hh mm ss.ss</text>

  <rect x="250" y="405" width="300" height="90" class="box"/>
  <text x="275" y="440" class="label">Camera Delay Calibration</text>
  <text x="275" y="463" class="small">GPS flasher, frame + line delay</text>

  <path d="M240 150 L285 150" class="arrow"/>
  <path d="M480 150 L525 150" class="arrow"/>
  <path d="M625 190 L625 250" class="arrow"/>
  <path d="M480 300 L525 300" class="arrow"/>
  <path d="M385 340 L385 400" class="arrow"/>
  <path d="M555 450 L625 385" class="arrow"/>

  <text x="50" y="530" class="small">Goal: keep uncertainty bounded so event timing remains scientifically useful.</text>
</svg>
